services:
  # ========================================================
  # 1. Smart Campus Backend REST API Web Service
  # ========================================================
  - type: web
    name: smart-campus-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: smart-campus-frontend
          property: host

  # ========================================================
  # 2. Smart Campus Frontend React SPA Static Site
  # ========================================================
  - type: web
    name: smart-campus-frontend
    env: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # Single Page Application rewrite rule
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smart-campus-backend
          property: host
